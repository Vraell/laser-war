[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-war"
version = "0.6.0"
description = "Playable reconstruction of the Laser War mirror strategy game."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5.2,<3"]

[project.optional-dependencies]
dev = ["coverage>=7.6", "ruff>=0.9"]
release = ["pillow>=11", "pyinstaller>=6.11"]

[project.scripts]
laser-war = "laser_war.pygame_app:main"
laser-war-cli = "laser_war.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["laser_war*"]

[tool.setuptools.package-data]
laser_war = ["assets/*.png", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
