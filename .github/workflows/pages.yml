name: Deploy Web Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.production.outputs.result }}

    steps:
      - name: Resolve latest green production revision
        id: production
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              branch: context.ref.replace("refs/heads/", ""),
              status: "success",
              per_page: 1,
            });
            const baseline = data.workflow_runs[0]?.head_sha;
            if (!baseline) core.setFailed("No successful production workflow exists to use as a baseline.");
            core.info(`Production baseline: ${baseline}`);
            return baseline;

  quality:
    runs-on: ubuntu-latest
    needs: baseline

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --test web/*.test.mjs scripts/arena_stats.test.mjs scripts/arena_integrity.test.mjs scripts/arena_aggregate.test.mjs

      - name: Run tactical corpus
        run: node scripts/tactical_benchmark.mjs

      - name: Compare search speed
        run: node scripts/search_benchmark.mjs ${{ needs.baseline.outputs.sha }} --gate=nonregression

      - name: Compare standard AI strength
        run: >-
          node scripts/elo_benchmark.mjs
          --pairs 64
          --difficulties easy,medium,hard
          --opening-plies 0,2,4,6,8,10
          --max-plies 96
          --resource nodes
          --ultra-nodes 20000
          --openings mixed
          --gate nonregression
          --candidate-ref HEAD
          --baseline-ref ${{ needs.baseline.outputs.sha }}

  ultra-strength:
    runs-on: ubuntu-latest
    needs: baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mixed
            pairs: 4
            pair_offset: 0
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: mixed
            pairs: 4
            pair_offset: 4
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: mixed
            pairs: 4
            pair_offset: 8
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: mixed
            pairs: 4
            pair_offset: 12
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: mixed
            pairs: 4
            pair_offset: 16
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: mixed
            pairs: 4
            pair_offset: 20
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: mixed
            pairs: 4
            pair_offset: 24
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: mixed
            pairs: 4
            pair_offset: 28
            seed_offset: 0
            opening_plies: 0,2,4,6,8,10
          - suite: confirmation
            pairs: 4
            pair_offset: 0
            seed_offset: 10000
            opening_plies: 2,4,6,8,10
          - suite: confirmation
            pairs: 4
            pair_offset: 4
            seed_offset: 10000
            opening_plies: 2,4,6,8,10
          - suite: confirmation
            pairs: 4
            pair_offset: 8
            seed_offset: 10000
            opening_plies: 2,4,6,8,10
          - suite: confirmation
            pairs: 4
            pair_offset: 12
            seed_offset: 10000
            opening_plies: 2,4,6,8,10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compare Ultra strength shard
        run: >-
          node scripts/elo_benchmark.mjs
          --pairs ${{ matrix.pairs }}
          --pair-offset ${{ matrix.pair_offset }}
          --seed-offset ${{ matrix.seed_offset }}
          --difficulties ultra
          --opening-plies ${{ matrix.opening_plies }}
          --max-plies 96
          --resource nodes
          --ultra-nodes 20000
          --openings ${{ matrix.suite }}
          --gate off
          --candidate-ref HEAD
          --baseline-ref ${{ needs.baseline.outputs.sha }}
          --output arena-${{ matrix.suite }}-${{ matrix.pair_offset }}.json

      - name: Upload Ultra shard
        uses: actions/upload-artifact@v4
        with:
          name: ultra-${{ matrix.suite }}-${{ matrix.pair_offset }}
          path: arena-${{ matrix.suite }}-${{ matrix.pair_offset }}.json
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs:
      - baseline
      - quality
      - ultra-strength

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Ultra shards
        uses: actions/download-artifact@v4
        with:
          pattern: ultra-*
          path: arena-results
          merge-multiple: true

      - name: Validate complete Ultra qualification
        run: |
          node scripts/aggregate_arena.mjs --input arena-results --openings mixed --expected-pairs 32 --expected-shards 8 --max-plies 96 --resource nodes --ultra-nodes 20000 --seed-offset 0 --opening-plies 0,2,4,6,8,10 --candidate-ref HEAD --baseline-ref ${{ needs.baseline.outputs.sha }} --gate nonregression --output ultra-mixed.json
          node scripts/aggregate_arena.mjs --input arena-results --openings confirmation --expected-pairs 16 --expected-shards 4 --max-plies 96 --resource nodes --ultra-nodes 20000 --seed-offset 10000 --opening-plies 2,4,6,8,10 --candidate-ref HEAD --baseline-ref ${{ needs.baseline.outputs.sha }} --gate nonregression --output ultra-confirmation.json

      - name: Build browser game
        run: |
          ./scripts/build_web.sh
          node scripts/check_web_build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
