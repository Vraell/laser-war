name: Deploy Web Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run tests
        run: node --test web/*.test.mjs scripts/arena_stats.test.mjs

      - name: Run tactical corpus
        run: node scripts/tactical_benchmark.mjs

      - name: Compare search speed
        run: node scripts/search_benchmark.mjs HEAD^

      - name: Compare AI strength
        run: >-
          node scripts/elo_benchmark.mjs
          --pairs 32
          --difficulties ultra
          --opening-plies 0,2,4,6,8,10
          --max-plies 72
          --ultra-time 120
          --gate nonregression
          --baseline-ref HEAD^

      - name: Build browser game
        run: |
          ./scripts/build_web.sh
          node scripts/check_web_build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
